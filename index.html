<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 명언</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-soft: #171a21;
    --line: #262b36;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --accent: #7aa2f7;
    --accent-soft: rgba(122, 162, 247, 0.14);
  }

  html[data-theme="light"] {
    --bg: #f6f7fb;
    --bg-soft: #ffffff;
    --line: #e2e5ec;
    --text: #1b1f27;
    --muted: #6b7280;
    --accent: #3b62c4;
    --accent-soft: rgba(59, 98, 196, 0.10);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, sans-serif;
    transition: background .3s ease, color .3s ease;
  }

  header {
    text-align: center;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: .9rem;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 720px;
  }

  .chip {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: .82rem;
    font-family: inherit;
    cursor: pointer;
    transition: all .18s ease;
  }

  .chip:hover { color: var(--text); border-color: var(--accent); }

  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  .card {
    width: min(720px, 100%);
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 52px 44px 40px;
    position: relative;
    box-shadow: 0 18px 48px rgba(0, 0, 0, .18);
  }

  .card::before {
    content: "\201C";
    position: absolute;
    top: 4px;
    left: 28px;
    font-size: 6rem;
    line-height: 1;
    color: var(--accent);
    opacity: .22;
    font-family: Georgia, "Times New Roman", serif;
  }

  #quote {
    margin: 0;
    font-size: clamp(1.15rem, 2.4vw, 1.6rem);
    line-height: 1.65;
    font-weight: 500;
    letter-spacing: -0.01em;
    word-break: keep-all;
  }

  #author {
    margin: 24px 0 0;
    text-align: right;
    color: var(--muted);
    font-size: .95rem;
  }

  #author strong { color: var(--text); font-weight: 600; }

  .tag {
    display: inline-block;
    margin-top: 20px;
    padding: 4px 11px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: .74rem;
    font-weight: 600;
  }

  .fade { animation: fade .45s ease; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    border: 1px solid var(--line);
    background: var(--bg-soft);
    color: var(--text);
    padding: 11px 22px;
    border-radius: 10px;
    font-size: .9rem;
    font-family: inherit;
    cursor: pointer;
    transition: all .18s ease;
  }

  .btn:hover { border-color: var(--accent); color: var(--accent); }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .btn.primary:hover { color: #fff; filter: brightness(1.08); }

  footer {
    color: var(--muted);
    font-size: .78rem;
    text-align: center;
  }

  kbd {
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 6px;
    font-size: .72rem;
    font-family: inherit;
  }

  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translate(-50%, 20px);
    background: var(--accent);
    color: #fff;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: .85rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all .25s ease;
  }

  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 520px) {
    .card { padding: 44px 24px 32px; }
    .card::before { left: 14px; font-size: 4.5rem; }
  }
</style>
</head>
<body>

<header>
  <h1>오늘의 명언</h1>
  <p>마음에 남는 한 문장을 만나보세요</p>
</header>

<nav class="filters" id="filters" aria-label="주제 선택"></nav>

<main class="card">
  <blockquote id="quote"></blockquote>
  <p id="author"></p>
  <span class="tag" id="tag"></span>
</main>

<div class="actions">
  <button class="btn primary" id="next">다음 명언</button>
  <button class="btn" id="copy">복사하기</button>
  <button class="btn" id="theme">라이트 모드</button>
</div>

<footer>
  <kbd>Space</kbd> 다음 명언 · <kbd>C</kbd> 복사
</footer>

<div id="toast"></div>

<script>
const QUOTES = [
  { text: "삶이 있는 한 희망은 있다.", author: "키케로", tag: "인생" },
  { text: "산다는 것 그것은 치열한 전투이다.", author: "로망 롤랑", tag: "인생" },
  { text: "우리의 인생은 우리가 노력한 만큼 가치가 있다.", author: "프랑수아 모리아크", tag: "인생" },
  { text: "인생은 자전거를 타는 것과 같다. 균형을 잡으려면 계속 움직여야 한다.", author: "알베르트 아인슈타인", tag: "인생" },
  { text: "가장 큰 영광은 한 번도 실패하지 않음이 아니라 실패할 때마다 다시 일어서는 데 있다.", author: "공자", tag: "도전" },
  { text: "나는 실패한 것이 아니다. 잘 되지 않는 만 가지 방법을 발견한 것이다.", author: "토머스 에디슨", tag: "도전" },
  { text: "천 리 길도 한 걸음부터.", author: "노자", tag: "도전" },
  { text: "할 수 있다고 믿는 사람은 그렇게 되고, 할 수 없다고 믿는 사람도 그렇게 된다.", author: "샤를 드골", tag: "도전" },
  { text: "성공은 최종적인 것이 아니고, 실패는 치명적인 것이 아니다. 중요한 것은 계속하는 용기다.", author: "윈스턴 처칠", tag: "도전" },
  { text: "행동은 모든 성공의 기본 열쇠다.", author: "파블로 피카소", tag: "도전" },
  { text: "위대한 일을 하는 유일한 방법은 자신이 하는 일을 사랑하는 것이다.", author: "스티브 잡스", tag: "일" },
  { text: "당신의 시간은 한정되어 있다. 그러니 다른 사람의 삶을 사느라 낭비하지 마라.", author: "스티브 잡스", tag: "일" },
  { text: "오늘 할 수 있는 일에 전력을 다하라. 그러면 내일은 한 걸음 더 나아갈 것이다.", author: "아이작 뉴턴", tag: "일" },
  { text: "기회는 준비된 자에게 찾아온다.", author: "루이 파스퇴르", tag: "일" },
  { text: "계획 없는 목표는 그저 소망에 불과하다.", author: "생텍쥐페리", tag: "일" },
  { text: "배움에는 끝이 없다. 무덤에 들어갈 때까지 배워야 한다.", author: "벤저민 프랭클린", tag: "배움" },
  { text: "나는 내가 아무것도 모른다는 것을 안다.", author: "소크라테스", tag: "배움" },
  { text: "아는 것을 안다고 하고 모르는 것을 모른다고 하는 것, 이것이 곧 아는 것이다.", author: "공자", tag: "배움" },
  { text: "책은 청년에게는 음식이 되고 노인에게는 오락이 된다.", author: "키케로", tag: "배움" },
  { text: "교육은 세상을 바꾸는 데 사용할 수 있는 가장 강력한 무기다.", author: "넬슨 만델라", tag: "배움" },
  { text: "행복은 습관이다. 그것을 몸에 지녀라.", author: "허버트 스펜서", tag: "행복" },
  { text: "행복한 삶에 필요한 것은 거의 없다. 모든 것은 당신 자신 안에, 당신의 사고방식에 있다.", author: "마르쿠스 아우렐리우스", tag: "행복" },
  { text: "웃음은 두 사람 사이의 가장 짧은 거리다.", author: "빅터 보르게", tag: "행복" },
  { text: "당신이 헛되이 보낸 오늘은 어제 죽은 이가 그토록 바라던 내일이다.", author: "소포클레스", tag: "행복" },
  { text: "우리가 두려워해야 할 유일한 것은 두려움 그 자체다.", author: "프랭클린 루스벨트", tag: "용기" },
  { text: "용기란 두려움이 없는 것이 아니라 두려움보다 더 중요한 것이 있다는 판단이다.", author: "앰브로즈 레드문", tag: "용기" },
  { text: "세상을 바꾸고 싶다면 스스로 그 변화가 되어라.", author: "마하트마 간디", tag: "용기" },
  { text: "언제나 불가능해 보이는 법이다, 그것이 이루어지기 전까지는.", author: "넬슨 만델라", tag: "용기" },
  { text: "죽는 날까지 하늘을 우러러 한 점 부끄럼이 없기를.", author: "윤동주", tag: "용기" },
  { text: "신은 스스로 돕는 자를 돕는다.", author: "벤저민 프랭클린", tag: "지혜" },
  { text: "펜은 칼보다 강하다.", author: "에드워드 불워리턴", tag: "지혜" },
  { text: "시간은 가장 현명한 조언자다.", author: "페리클레스", tag: "지혜" },
  { text: "지혜로운 자는 말할 것이 있어서 말하고, 어리석은 자는 말해야만 해서 말한다.", author: "플라톤", tag: "지혜" },
  { text: "생각하는 대로 살지 않으면 사는 대로 생각하게 된다.", author: "폴 부르제", tag: "지혜" },
  { text: "가장 어두운 밤도 언젠가 끝나고 해는 떠오른다.", author: "빅토르 위고", tag: "희망" },
  { text: "희망은 좋은 것이며, 아마도 가장 좋은 것이다. 좋은 것은 결코 사라지지 않는다.", author: "스티븐 킹", tag: "희망" },
  { text: "겨울이 오면 봄이 멀지 않으리.", author: "퍼시 셸리", tag: "희망" },
  { text: "내일은 내일의 태양이 뜬다.", author: "마거릿 미첼", tag: "희망" }
];

const els = {
  quote: document.getElementById("quote"),
  author: document.getElementById("author"),
  tag: document.getElementById("tag"),
  card: document.querySelector(".card"),
  filters: document.getElementById("filters"),
  toast: document.getElementById("toast"),
  next: document.getElementById("next"),
  copy: document.getElementById("copy"),
  theme: document.getElementById("theme")
};

let activeTag = "전체";
let current = null;

const tags = ["전체", ...new Set(QUOTES.map(q => q.tag))];
tags.forEach(tag => {
  const btn = document.createElement("button");
  btn.className = "chip";
  btn.textContent = tag;
  btn.setAttribute("aria-pressed", tag === activeTag);
  btn.addEventListener("click", () => {
    activeTag = tag;
    [...els.filters.children].forEach(c => c.setAttribute("aria-pressed", c === btn));
    showRandom();
  });
  els.filters.appendChild(btn);
});

function pool() {
  return activeTag === "전체" ? QUOTES : QUOTES.filter(q => q.tag === activeTag);
}

function showRandom() {
  const list = pool();
  // 같은 명언이 연속으로 나오지 않도록 (후보가 하나뿐이면 제외하지 않음)
  const candidates = list.length > 1 ? list.filter(q => q !== current) : list;
  render(candidates[Math.floor(Math.random() * candidates.length)]);
}

function render(q) {
  current = q;
  els.quote.textContent = q.text;
  els.author.innerHTML = "— <strong></strong>";
  els.author.querySelector("strong").textContent = q.author;
  els.tag.textContent = "#" + q.tag;

  els.card.classList.remove("fade");
  void els.card.offsetWidth; // 애니메이션 재시작
  els.card.classList.add("fade");
}

function toast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => els.toast.classList.remove("show"), 1600);
}

async function copyQuote() {
  const text = `"${current.text}" — ${current.author}`;
  try {
    await navigator.clipboard.writeText(text);
    toast("클립보드에 복사했습니다");
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    toast("클립보드에 복사했습니다");
  }
}

function toggleTheme() {
  const isLight = document.documentElement.getAttribute("data-theme") === "light";
  document.documentElement.setAttribute("data-theme", isLight ? "dark" : "light");
  els.theme.textContent = isLight ? "라이트 모드" : "다크 모드";
}

els.next.addEventListener("click", showRandom);
els.copy.addEventListener("click", copyQuote);
els.theme.addEventListener("click", toggleTheme);

document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (e.code === "Space") { e.preventDefault(); showRandom(); }
  if (e.key.toLowerCase() === "c") copyQuote();
});

showRandom();
</script>

</body>
</html>
